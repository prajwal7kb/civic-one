{% extends "base_mobile.html" %}
{% block content %}
<div class="p-4">
  <h2 class="text-xl font-bold text-slate-800 mb-3">Career Guidance</h2>
  {% for type, items in grouped.items() %}
  <div class="mb-5">
    <h3 class="font-bold text-slate-700 mb-2">{{ type }}</h3>
    <div class="space-y-2">
      {% for i in items %}
      <a href="{{ i.link }}" target="_blank" class="block bg-white p-3 rounded-xl shadow">
        <div class="font-semibold text-slate-800">{{ i.title }}</div>
        <div class="text-xs text-gray-500 mt-1">{{ i.description }}</div>
      </a>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
