{% extends "base_mobile.html" %}
{% block content %}
<div class="p-4">
  <a href="/schemes" class="text-blue-600 text-sm">← Back</a>
  <div class="bg-white rounded-xl shadow p-4 mt-3">
    <div class="text-xs text-blue-600 font-semibold">{{ s.category }}</div>
    <h2 class="text-xl font-bold text-slate-800 mt-1">{{ s.name }}</h2>
    <p class="text-slate-700 mt-3">{{ s.description }}</p>

    <div class="mt-4">
      <div class="text-xs text-gray-500">Eligibility</div>
      <div class="text-sm text-slate-800">{{ s.eligibility }}</div>
    </div>

    <div class="mt-3">
      <div class="text-xs text-gray-500">Deadline</div>
      <div class="text-sm text-slate-800">{{ s.deadline }}</div>
    </div>

    {% if s.link %}
    <a href="{{ s.link }}" target="_blank" class="block text-center bg-blue-600 text-white p-3 rounded-lg mt-4 font-medium tap">Apply / Learn More</a>
    {% endif %}

    <p class="text-xs text-gray-400 mt-4">This is an awareness tool. Always verify on the official portal.</p>
  </div>
</div>
{% endblock %}
