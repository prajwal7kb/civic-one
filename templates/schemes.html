{% extends "base_mobile.html" %}
{% block content %}
<div class="p-4">
  <h2 class="text-xl font-bold text-slate-800 mb-3">Government Schemes</h2>
  <form method="GET" class="mb-3">
    <input name="q" value="{{ q }}" placeholder="Search schemes..."
           class="w-full p-3 border rounded-lg bg-white">
  </form>
  <div class="space-y-2">
    {% for s in schemes %}
    <a href="/schemes/{{ s.id }}" class="block bg-white p-3 rounded-xl shadow">
      <div class="font-semibold text-slate-800">{{ s.name }}</div>
      <div class="text-xs text-blue-600 mt-1">{{ s.category }}</div>
      <div class="text-xs text-gray-500 mt-1">{{ s.description }}</div>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
